      parameters:
        - $ref: "#/components/parameters/SavedQueryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSavedQueryRequest"
      responses:
        "200":
          description: Saved query updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedQuery"
        "404":
          description: Saved query or data source not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required: [error, message]
        "409":
          description: Duplicate saved query name for the same owner and data source
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required: [error, message]
    delete:
      tags: [Query]
      summary: Delete a saved query
      parameters:
        - $ref: "#/components/parameters/SavedQueryId"
      responses:
        "200":
          description: Saved query deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedQueryDeleteResponse"
        "404":
          description: Saved query not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required: [error, message]
  /v1/saved-queries/{savedQueryId}/validate-params:
    post:
      tags: [Query]
      summary: Validate saved query parameters
      parameters:
        - $ref: "#/components/parameters/SavedQueryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateParamsRequest"
      responses:
        "200":
          description: Parameter validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateParamsResponse"
        "404":
          description: Saved query not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required: [error, message]
  /v1/saved-queries/{savedQueryId}/run:
    post:
      tags: [Query]
      summary: Run a saved query with parameters
      parameters:
        - $ref: "#/components/parameters/SavedQueryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunSavedQueryRequest"
      responses:
        "200":
          description: Saved query result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSavedQueryResponse"
        "400":
          description: Invalid saved query parameters or SQL
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      oneOf:
                        - type: object
                          properties:
                            param:
                              type: string
                              nullable: true
                            message:
                              type: string
                          required: [message]
                        - type: string
                required: [error, message]
        "404":
          description: Saved query not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required: [error, message]
  /v1/saved-queries/{savedQueryId}/share:
    post:
      tags: [Query]
      summary: Replace the share grants for a saved query (owner-only)
      parameters:
        - $ref: "#/components/parameters/SavedQueryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareSavedQueryRequest"
      responses:
        "200":
          description: Updated visibility + share grants, with diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedQueryShareResponse"
        "400":
          description: Invalid visibility or share grant payload
        "403":
          description: Caller is not the owner
        "404":
          description: Saved query not found
  /v1/saved-queries/{savedQueryId}/access:
    get:
      tags: [Query]
      summary: Get visibility + share grants for a saved query
      parameters:
        - $ref: "#/components/parameters/SavedQueryId"
      responses:
        "200":
          description: Current access summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedQueryAccessResponse"
        "403":
          description: Caller does not have access to this saved query
        "404":
          description: Saved query not found
  /v1/saved-queries/{savedQueryId}/versions:
    get:
      tags: [Query]
      summary: List revisions of a saved query (newest first)
      parameters:
        - $ref: "#/components/parameters/SavedQueryId"
      responses:
        "200":
          description: Version list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedQueryVersionListResponse"
        "403":
          description: Caller does not have access to this saved query
        "404":
          description: Saved query not found
  /v1/saved-queries/{savedQueryId}/versions/{versionId}/restore:
    post:
      tags: [Query]
      summary: Restore a saved query to a previous version (owner-only)
      parameters:
        - $ref: "#/components/parameters/SavedQueryId"
        - in: path
          name: versionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Restored. Body includes the new live row plus the version that was just appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedQueryRestoreResponse"
        "403":
          description: Caller is not the owner
        "404":
          description: Saved query or version not found
  /v1/saved-query-folders:
    post:
      tags: [Query]
      summary: Create a saved-query folder (per-owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSavedQueryFolderRequest"
      responses:
        "201":
          description: Folder created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedQueryFolder"
        "400":
          description: Invalid name or parent_id shape
        "403":
          description: parent_id belongs to another owner
        "404":
          description: parent_id folder not found
        "409":
          description: A sibling folder with that name already exists
    get:
      tags: [Query]
      summary: List the caller's folders, flat plus pre-built tree
      responses:
        "200":
          description: Folder list and tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedQueryFolderListResponse"
  /v1/saved-query-folders/{folderId}:
    put:
      tags: [Query]
      summary: Rename or move a folder (owner-only)
      parameters:
        - in: path
          name: folderId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSavedQueryFolderRequest"
      responses:
        "200":
          description: Updated folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedQueryFolder"
        "400":
          description: Invalid name or self/descendant parent move
        "403":
          description: Caller is not the folder owner, or parent_id belongs to another owner
        "404":
          description: Folder not found
        "409":
          description: Sibling-name collision under the target parent
    delete:
      tags: [Query]
      summary: Delete a folder; direct children are reparented to its parent (REASSIGN policy)
      parameters:
        - in: path
          name: folderId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Folder deleted; response lists what was reparented and the new parent (null for root).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSavedQueryFolderResponse"
        "403":
          description: Caller is not the folder owner
        "404":
          description: Folder not found
  /v1/saved-queries/{savedQueryId}/move:
    post:
      tags: [Query]
      summary: "Move a saved query into a folder (owner-only). `folder_id: null` moves to root."
      parameters:
        - $ref: "#/components/parameters/SavedQueryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveSavedQueryRequest"
      responses:
        "200":
          description: Updated saved query plus the resolved folder context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveSavedQueryResponse"
        "400":
          description: folder_id is not a UUID
        "403":
          description: Caller is not the owner, or folder_id belongs to another owner
        "404":
          description: Saved query or folder_id not found
