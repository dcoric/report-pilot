                          format: date-time
                      required: [provider, status, checked_at]
                required: [items]
  /v1/observability/metrics:
    get:
      tags: [Observability]
      summary: Aggregated observability metrics over a time window
      parameters:
        - in: query
          name: window_hours
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 720
      responses:
        "200":
          description: Metrics snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservabilityMetricsResponse"
  /v1/observability/release-gates:
    get:
      tags: [Observability]
      summary: Latest benchmark release-gate outcome
      responses:
        "200":
          description: Latest benchmark release gate status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseGatesResponse"
        "404":
          description: No benchmark report found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required: [error, message]
  /v1/observability/benchmark-command:
    get:
      tags: [Observability]
      summary: Benchmark CLI command derived from runtime configuration
      responses:
        "200":
          description: Shell command and environment values for running the benchmark
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkCommandResponse"
  /v1/observability/release-gates/report:
    post:
      tags: [Observability]
      summary: Persist a benchmark report for release-gate tracking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BenchmarkReportUploadRequest"
      responses:
        "201":
          description: Benchmark report stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                required: [id, created_at]
components:
  parameters:
    SessionId:
      in: path
      name: sessionId
      required: true
      schema:
        type: string
    DataSourceId:
      in: path
      name: dataSourceId
      required: true
      schema:
        type: string
    NoteId:
      in: path
      name: noteId
      required: true
      schema:
        type: string
    SchemaObjectId:
      in: path
      name: schemaObjectId
      required: true
      schema:
        type: string
    SavedQueryId:
      in: path
      name: savedQueryId
      required: true
      schema:
        type: string
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginLockoutResponse:
      type: object
      required: [error, retry_after_seconds]
      properties:
        error:
          type: string
          enum: [too_many_requests]
        reason:
          type: string
          enum: [too_many_failed_logins, ip_throttled]
        retry_after_seconds:
          type: integer
          minimum: 1
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        display_name:
          type: string
          nullable: true
        is_active:
          type: boolean
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        roles:
          type: array
          description: System role names the user holds (e.g. `admin`, `analyst`, `viewer`).
          items:
            type: string
        permissions:
          type: array
          description: Effective permission names granted by the user's roles. The frontend uses this list to gate UI affordances.
          items:
            type: string
    AuthMeResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        expires_at:
          type: string
          format: date-time
          nullable: true
    AdminUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        display_name:
          type: string
          nullable: true
        is_active:
          type: boolean
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        roles:
          type: array
          items:
            type: string
    AdminUserListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
    CreateAdminUserRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        display_name:
          type: string
          nullable: true
        roles:
          type: array
          description: Role names to assign. Defaults to `viewer` when omitted or empty.
          items:
            type: string
    UpdateUserRolesRequest:
      type: object
      description: At least one of `assign` or `revoke` must be a non-empty array.
      properties:
        assign:
          type: array
          items:
            type: string
        revoke:
          type: array
          items:
            type: string
    AuthProvider:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [oidc]
        name:
          type: string
        display_name:
          type: string
          nullable: true
        issuer:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
          nullable: true
          description: Redacted as `***` when present; never returned in plaintext.
        scopes:
          type: array
          items:
            type: string
        redirect_uri:
          type: string
        claims_mapping:
          type: object
          properties:
            email:
              type: string
            display_name:
              type: string
        enabled:
          type: boolean
        auto_link_by_email:
          type: boolean
          description: AUTH-012. When true, an SSO login whose email matches an existing local user is auto-linked.
        jit_enabled:
          type: boolean
          description: AUTH-012. When true, an SSO login for an unknown email creates a local user.
        jit_default_role:
          type: string
          description: Role name assigned to JIT-created users (case-insensitive).
        jit_allowed_domains:
          type: array
          description: When non-empty, JIT only applies to emails whose domain is in this list (case-insensitive).
          items:
            type: string
        require_email_verified:
          type: boolean
          description: AUTH-015. When true, the IdP must assert `email_verified=true` before this app will auto-link an existing local user by email or provision a new one via JIT. Default true.
        scim_group_mappings:
          type: object
          description: AUTH-013. SCIM group `displayName` (key, case-insensitive at lookup) to local role name (value).
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AuthProviderMappingRulesRequest:
      type: object
      description: |
        AUTH-012 mapping rules + AUTH-015 email-verified gate. Only the
        fields supplied are updated.
      properties:
        auto_link_by_email:
          type: boolean
        jit_enabled:
          type: boolean
        jit_default_role:
          type: string
        jit_allowed_domains:
          type: array
          items:
            type: string
        require_email_verified:
          type: boolean
    AuthProviderMappingRulesResponse:
      type: object
      required: [provider_id, auto_link_by_email, jit_enabled, jit_default_role, jit_allowed_domains, require_email_verified]
      properties:
        provider_id:
          type: string
          format: uuid
        auto_link_by_email:
          type: boolean
        jit_enabled:
          type: boolean
        jit_default_role:
          type: string
        jit_allowed_domains:
          type: array
          items:
            type: string
        require_email_verified:
          type: boolean
    LinkedIdentity:
      type: object
      required: [id, user_id, provider_id, subject]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        subject:
          type: string
        email_at_link:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        provider:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            display_name:
              type: string
              nullable: true
            type:
              type: string
            enabled:
              type: boolean
    ScimTokenRecord:
      type: object
      required: [id, provider_id, label, created_at]
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        label:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
    ScimTokenListResponse:
      type: object
