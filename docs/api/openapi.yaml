openapi: 3.1.0
info:
  title: Report Pilot API
  version: 0.1.0
  description: API for NL-to-SQL reporting with multi-DB and multi-LLM support.
servers:
  - url: /
    description: Local runtime (same origin)
tags:
  - name: Query
  - name: Export
  - name: Admin
  - name: Providers
  - name: Observability
  - name: Auth
  - name: SCIM
paths:
  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate with email and password
      description: |
        Returns the authenticated user and sets an HttpOnly session cookie.
        After repeated failures from the same email or source IP within a
        sliding window, the endpoint refuses further attempts with `429` and
        a `Retry-After` header (AUTH-009).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated. Session cookie set in `Set-Cookie`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "400":
          description: Missing email or password
        "401":
          description: Invalid credentials
        "429":
          description: |
            Too many failed login attempts for this email or source IP.
            Retry once `Retry-After` (in seconds) has elapsed.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds the client should wait before retrying.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginLockoutResponse"
  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: End the current session
      description: Revokes the current session token (if any) and clears the cookie.
      responses:
        "200":
          description: Session revoked. Cookie cleared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /v1/auth/me:
    get:
      tags: [Auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "401":
          description: No active session
  /v1/users/me/config:
    get:
      tags: [Auth]
      summary: Get the current user's configuration profile
      description: |
        Returns the authenticated user's saved preferences (default data
        source, default LLM provider/model, max rows, timeout, theme, table
        preferences). Falls back to baseline defaults when no row has been
        saved yet. AUTH-006.
      responses:
        "200":
          description: User configuration
          content:
            application/json:
              schema:
                type: object
                required: [config]
                properties:
                  config:
                    $ref: "#/components/schemas/UserConfig"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
    put:
      tags: [Auth]
      summary: Replace the current user's configuration profile
      description: |
        Replaces the saved configuration with the supplied body. All known
        fields are validated server-side; unknown fields return 400.
        AUTH-006.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserConfig"
      responses:
        "200":
          description: Saved configuration
          content:
            application/json:
              schema:
                type: object
                required: [config]
                properties:
                  config:
                    $ref: "#/components/schemas/UserConfig"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserConfigErrorResponse"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
  /v1/users/me/prompt-presets:
    get:
      tags: [Auth]
      summary: List the current user's prompt presets, plus any presets shared by others
      description: AUTH-007. Returns the union of the caller's own presets (any visibility) and other users' presets with `visibility = 'shared'`, newest first.
      responses:
        "200":
          description: Presets visible to the caller
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PromptPreset"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
    post:
      tags: [Auth]
      summary: Create a prompt preset owned by the current user
      description: AUTH-007.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptPresetUpsertRequest"
      responses:
        "201":
          description: Preset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptPreset"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserConfigErrorResponse"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
  /v1/users/me/prompt-presets/{id}:
    put:
      tags: [Auth]
      summary: Update an owned prompt preset
      description: AUTH-007. Partial update — only the supplied fields are changed. Only the owner can edit.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptPresetUpsertRequest"
      responses:
        "200":
          description: Updated preset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptPreset"
        "400":
          description: Invalid input
        "401":
          description: Unauthenticated
        "403":
          description: Caller is not the owner
        "404":
          description: Preset not found
    delete:
      tags: [Auth]
      summary: Delete an owned prompt preset
      description: AUTH-007. Only the owner can delete.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: string
        "401":
          description: Unauthenticated
        "403":
          description: Caller is not the owner
        "404":
          description: Preset not found
  /v1/admin/users:
    get:
      tags: [Admin]
      summary: List users and their roles
      description: Requires the `admin` role. Returns 401 when unauthenticated, 403 when authenticated without `admin`.
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserListResponse"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
    post:
      tags: [Admin]
      summary: Create a user
      description: |
        Requires the `admin` role. If `roles` is omitted, the new user is
        assigned the default role (`viewer`). The action is recorded in the
        auth audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Invalid input
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "409":
          description: Email already exists
  /v1/auth/oidc/providers:
    get:
      tags: [Auth]
      summary: List enabled OIDC providers for the login page
      description: Public endpoint. Returns only the metadata the login UI needs (`id`, `name`, `display_name`, `type`); secrets and admin-only fields are never exposed here.
      responses:
        "200":
          description: Enabled providers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProviderLoginListResponse"
  /v1/auth/oidc/login:
    get:
      tags: [Auth]
      summary: Start the OIDC authorization-code (PKCE) flow
      description: |
        Public endpoint. Generates state / nonce / PKCE verifier, sets a
        short-lived signed cookie (`rp_oidc_flow`), and 302-redirects to the
        IdP's authorize URL. The user agent returns to `/v1/auth/oidc/callback`.
      parameters:
        - in: query
          name: provider_id
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to IdP authorize URL
        "400":
          description: Missing provider_id
        "404":
          description: Provider not found or disabled
  /v1/auth/oidc/callback:
    get:
      tags: [Auth]
      summary: OIDC callback — exchange code, validate ID token, create session
      description: |
        Public endpoint. Reads the signed flow cookie, verifies `state`/`nonce`,
        exchanges the authorization code with PKCE, validates the ID token,
        looks up a local user by `email`, and creates a session. AUTH-015
        adds replay protection: each `state` value can only be redeemed
        once — a second callback with the same state returns `400` with
        `code: "state_replayed"`.
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
        - in: query
          name: state
          required: true
          schema:
            type: string
      responses:
        "302":
          description: "Successful login — `Set-Cookie: rp_session=...` and redirect to `/dashboard`"
        "400":
          description: |
            Missing or expired flow cookie, failed token exchange, or replayed
            `state` (response body `code: "state_replayed"`).
        "403":
          description: |
            No active local account for the IdP email claim, JIT disabled, JIT
            domain not allowed, or `email_verified=false` from the IdP
            (`code: "email_unverified"`).
        "404":
          description: Provider no longer available
  /v1/admin/auth-providers:
    get:
      tags: [Admin]
      summary: List configured auth providers
      description: Requires the `admin` role. `client_secret` is redacted as `***` when present.
      responses:
        "200":
          description: Provider list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviderListResponse"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
    post:
      tags: [Admin]
      summary: Create or update an auth provider
      description: |
        Requires the `admin` role. Pass `id` to update an existing row; omit it
        to create. Omitting `client_secret` on update keeps the existing value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthProviderUpsertRequest"
      responses:
        "200":
          description: Provider updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProvider"
        "201":
          description: Provider created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProvider"
        "400":
          description: Invalid input
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "404":
          description: Provider not found (when updating)
        "409":
          description: A provider with that name already exists
  /v1/admin/auth-providers/{providerId}:
    delete:
      tags: [Admin]
      summary: Delete an auth provider
      description: Requires the `admin` role.
      parameters:
        - in: path
          name: providerId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Provider deleted
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "404":
          description: Provider not found
  /v1/admin/auth-providers/{providerId}/mapping-rules:
    post:
      tags: [Admin]
      summary: Update account-linking and JIT provisioning rules for a provider
      description: |
        Requires the `admin` role. Updates the per-provider mapping rules
        (account linking by email + just-in-time user provisioning). Only the
        fields supplied in the body are changed; omitted fields keep their
        current value. AUTH-012.
      parameters:
        - in: path
          name: providerId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthProviderMappingRulesRequest"
      responses:
        "200":
          description: Updated rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviderMappingRulesResponse"
        "400":
          description: Invalid input
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "404":
          description: Provider not found
  /v1/admin/users/{userId}/linked-identities:
    get:
      tags: [Admin]
      summary: List external identities linked to a local user
      description: Requires the `admin` role. Returns each (provider, subject) pair attached to the user, including the original email captured at link time.
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Linked identities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedIdentityListResponse"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "404":
          description: User not found
  /v1/admin/users/{userId}/linked-identities/{providerId}:
    delete:
      tags: [Admin]
      summary: Unlink an external identity from a user
      description: Requires the `admin` role. Removes the link between the user and the auth provider. The user keeps their local account; subsequent SSO from this provider will go through the linking / JIT path again.
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
        - in: path
          name: providerId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Unlinked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  user_id:
                    type: string
                  provider_id:
                    type: string
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "404":
          description: No linked identity for that user / provider
  /v1/admin/auth-providers/{providerId}/test:
    post:
      tags: [Admin]
      summary: Test an OIDC provider's reachability and metadata
      description: |
        Requires the `admin` role. Runs OIDC discovery against the configured
        issuer and returns the parsed metadata or a structured error. Does NOT
        attempt authentication.
      parameters:
        - in: path
          name: providerId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Test result (success or failure). Always 200 — inspect `ok`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviderTestResult"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "404":
          description: Provider not found
  /v1/admin/auth-providers/{providerId}/scim-group-mappings:
    post:
      tags: [Admin]
      summary: Update the SCIM-group-to-local-role mapping for a provider
      description: |
        Requires the `admin` role. Replaces the SCIM group mapping object
        for the provider — keys are SCIM Group `displayName` values, values
        are local role names. AUTH-013.
      parameters:
        - in: path
          name: providerId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        "200":
          description: Updated mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimGroupMappingsResponse"
        "400":
          description: Invalid input
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "404":
          description: Provider not found
  /v1/admin/auth-providers/{providerId}/scim-tokens:
    get:
      tags: [Admin]
      summary: List SCIM bearer tokens issued for a provider
      description: Requires the `admin` role. Token plaintext is never returned — only the label, IDs, and timestamps.
      parameters:
        - in: path
          name: providerId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Token records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimTokenListResponse"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
    post:
      tags: [Admin]
      summary: Issue a new SCIM bearer token for a provider
      description: |
        Requires the `admin` role. The plaintext token is returned ONLY in
        this response — store it immediately. Subsequent reads return only
        the record metadata. AUTH-013.
      parameters:
        - in: path
          name: providerId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
      responses:
        "201":
          description: Token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimTokenIssueResponse"
        "400":
          description: Invalid input
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "404":
          description: Provider not found
  /v1/admin/auth-providers/{providerId}/scim-tokens/{tokenId}:
    delete:
      tags: [Admin]
      summary: Revoke a SCIM bearer token
      description: Requires the `admin` role. Revocation is irreversible.
      parameters:
        - in: path
          name: providerId
          required: true
          schema:
            type: string
        - in: path
          name: tokenId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Token revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  record:
                    $ref: "#/components/schemas/ScimTokenRecord"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "404":
          description: Token not found
  /scim/v2/ServiceProviderConfig:
    get:
      tags: [SCIM]
      summary: SCIM 2.0 service-provider configuration (RFC 7644 §4)
      description: Bearer-authenticated. Returns capabilities and the auth scheme. Used by upstream IdPs to discover what's supported before pushing.
      responses:
        "200":
          description: Service provider configuration
          content:
            application/scim+json:
              schema:
                type: object
        "401":
          description: Missing or invalid bearer token
  /scim/v2/Users:
    get:
      tags: [SCIM]
      summary: List or filter SCIM users for this provider
      description: |
        Bearer-authenticated. Supports `filter` with `userName eq "x"` and
        `externalId eq "x"` — the minimum every major IdP uses to dedup
        before POST.
      responses:
        "200":
          description: List response
          content:
            application/scim+json:
              schema:
                type: object
        "401":
          description: Missing or invalid bearer token
    post:
      tags: [SCIM]
      summary: Create or link a user
      description: Bearer-authenticated. Idempotency is handled by the `externalId` field.
      responses:
        "201":
          description: User created (or existing user linked)
          content:
            application/scim+json:
              schema:
                type: object
        "400":
          description: Invalid SCIM payload
        "409":
          description: Subject already linked to a different user
  /v1/admin/audit-events:
    get:
      tags: [Admin]
      summary: List audit events for auth and permission changes
      description: |
        Requires the `admin` role. Returns audit entries written by AUTH-008
        for login/logout, failed logins, role and permission mutations, data
        source access changes, and auth provider CRUD. Results are reverse
        chronological. Filters are AND-combined; pagination via `limit` /
        `offset`.
      parameters:
        - in: query
          name: action
          schema:
            type: string
          description: Exact action name (e.g. `auth.login.failure`, `role.assigned`).
        - in: query
          name: actor_user_id
          schema:
            type: string
            format: uuid
        - in: query
          name: target_user_id
          schema:
            type: string
            format: uuid
        - in: query
          name: outcome
          schema:
            type: string
            enum: [success, failure, info]
        - in: query
          name: since
          schema:
            type: string
            format: date-time
          description: Inclusive lower bound on `created_at` (ISO 8601).
        - in: query
          name: until
          schema:
            type: string
            format: date-time
          description: Exclusive upper bound on `created_at` (ISO 8601).
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Page of audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventListResponse"
        "400":
          description: Invalid query parameter
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
  /v1/admin/data-sources/{dataSourceId}/access:
    get:
      tags: [Admin]
      summary: List users granted access to a data source
      description: Requires the `admin` role. Admins implicitly access every data source; this endpoint returns only the explicit grants in `user_data_source_access`.
      parameters:
        - in: path
          name: dataSourceId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of granted users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceAccessListResponse"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "404":
          description: Data source not found
    post:
      tags: [Admin]
      summary: Grant a user access to a data source
      description: Requires the `admin` role. Idempotent; re-granting an existing access returns 200 with `granted=false`.
      parameters:
        - in: path
          name: dataSourceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantDataSourceAccessRequest"
      responses:
        "201":
          description: Access newly granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceAccessChange"
        "200":
          description: Access already granted (no-op)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceAccessChange"
        "400":
          description: Invalid input
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "404":
          description: Data source or user not found
  /v1/admin/data-sources/{dataSourceId}/access/{userId}:
    delete:
      tags: [Admin]
      summary: Revoke a user's access to a data source
      description: Requires the `admin` role.
      parameters:
        - in: path
          name: dataSourceId
          required: true
          schema:
            type: string
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Access revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceAccessChange"
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "404":
          description: No access grant to revoke
  /v1/admin/users/{userId}/roles:
    post:
      tags: [Admin]
      summary: Assign and/or revoke roles for a user
      description: |
        Requires the `admin` role. `assign` and `revoke` are independent — pass
        either or both. Each effective change is written to the auth audit log.
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRolesRequest"
      responses:
        "200":
          description: Updated user with applied changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateUserRolesResponse"
        "400":
          description: Invalid input
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
        "404":
          description: User not found
  /v1/query/prompts/history:
    get:
      tags: [Query]
      summary: List prompt history for the current user
      parameters:
        - in: query
          name: data_source_id
          required: false
          schema:
            type: string
        - in: query
          name: q
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Prompt history entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptHistoryResponse"
  /v1/saved-queries:
    get:
      tags: [Query]
      summary: List saved queries
      parameters:
        - in: query
          name: data_source_id
          required: false
          schema:
            type: string
        - in: query
          name: tag
          required: false
          schema:
            type: string
          description: Filter to saved queries that include this tag.
      responses:
        "200":
          description: Saved query entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedQueryListResponse"
    post:
      tags: [Query]
      summary: Create a saved query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSavedQueryRequest"
      responses:
        "201":
          description: Saved query created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedQuery"
        "409":
          description: Duplicate saved query name for the same owner and data source
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required: [error, message]
  /v1/saved-queries/{savedQueryId}:
